# LiteLLM gateway config for module 00. The stack mounts this directory at /app/config.
# Reload after editing:  lab/bin/reload-gateway.sh
model_list:
  - model_name: chat
    litellm_params: {model: openai/chat, api_base: "http://llama-chat:8080/v1", api_key: none}
  - model_name: coder
    litellm_params: {model: openai/coder, api_base: "http://llama-coder:8080/v1", api_key: none}
  - model_name: embed
    litellm_params: {model: openai/embed, api_base: "http://llama-embed:8080/v1", api_key: none}

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  proxy_batch_write_at: 5          # lab-only: spend rows appear 2-5 s after a request

litellm_settings:
  callbacks: ["prometheus"]
  require_auth_for_metrics_endpoint: false
  cache: true
  cache_params:
    type: redis
    host: valkey
    port: 6379
    supported_call_types: []
router_settings:
  redis_host: valkey
  redis_port: 6379
