# Model-serving Deployment (reference solution): toleration for the new pool's taint added.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-serve
  namespace: serving
  labels: {course: aiinfra, app: model-serve}
spec:
  replicas: @REPL@
  selector: {matchLabels: {app: model-serve}}
  template:
    metadata:
      labels: {course: aiinfra, app: model-serve}
    spec:
      terminationGracePeriodSeconds: 1
      nodeSelector:
        pool: gpu-b-@V@
      tolerations:
        - {key: pool-@V@, operator: Equal, value: gpu, effect: NoSchedule}
      containers:
        - name: engine
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["sleep", "3600"]
          resources:
            limits:
              nvidia.com/gpu: 1
