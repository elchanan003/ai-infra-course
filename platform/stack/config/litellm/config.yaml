# Base LiteLLM config for the course stack (profile gw). Modules override the whole directory
# with LITELLM_CONFIG_DIR=<dir> (must contain config.yaml; mounted at /app/config).
# Lab-only: proxy_batch_write_at: 5 (spend-log lag 2-5 s instead of 60 s) and unauthenticated /metrics/.
model_list:
  - model_name: chat
    litellm_params: {model: openai/chat, api_base: "http://llama-chat:8080/v1", api_key: none}
  - model_name: coder
    litellm_params: {model: openai/coder, api_base: "http://llama-coder:8080/v1", api_key: none}
  - model_name: embed
    litellm_params: {model: openai/embed, api_base: "http://llama-embed:8080/v1", api_key: none}
  # simulated backends (profile mock); served-model-name "chat" inside mock-vllm
  - model_name: mock-a
    litellm_params: {model: openai/chat, api_base: "http://mock-vllm-a:8000/v1", api_key: none}
  - model_name: mock-b
    litellm_params: {model: openai/chat, api_base: "http://mock-vllm-b:8000/v1", api_key: none}

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY      # sk-aiinfra-master
  database_url: os.environ/DATABASE_URL
  proxy_batch_write_at: 5

litellm_settings:
  callbacks: ["prometheus"]
  require_auth_for_metrics_endpoint: false       # /metrics/ open (scraped by Prometheus)
  # success_callback: ["langfuse"]                # enable with profile lf (keys/host already in env)
  cache: true                                    # needed so rate limits are global across replicas
  cache_params:
    type: redis
    host: valkey
    port: 6379
    supported_call_types: []                     # [] = no response caching, limit counters only

router_settings:
  redis_host: valkey
  redis_port: 6379
