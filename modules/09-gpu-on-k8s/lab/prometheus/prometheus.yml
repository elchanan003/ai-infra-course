# Given (task 9.2): Prometheus config for the GPU lab. Lab-only: 5 s scrape/evaluation.
# Your rules live in rules/dcgm-alerts.yml. Reload after edits: ../../../platform/stack.sh reload-prometheus
global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s
  external_labels:
    stack: aiinfra

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: mock-dcgm            # SIMULATED dcgm-exporter, one container per simulated node
    metrics_path: /metrics
    dns_sd_configs:
      - {names: [mock-dcgm-a, mock-dcgm-b], type: A, port: 8000}
    relabel_configs:
      - {source_labels: [__meta_dns_name], target_label: instance}
