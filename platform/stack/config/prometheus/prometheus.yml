# Base Prometheus config for the course stack (profile obs). Lab-only: 5 s scrape interval.
# Modules override the whole directory with PROM_CONFIG_DIR=<dir> (prometheus.yml + rules/*.yml).
# Targets are found via DNS (compose service names): a profile that is not up simply has no targets.
global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s
  external_labels:
    stack: aiinfra

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: litellm
    metrics_path: /metrics/        # /metrics 307-redirects here
    dns_sd_configs:
      - {names: [litellm, litellm-2], type: A, port: 4000}
    relabel_configs: &by-name
      - {source_labels: [__meta_dns_name], target_label: instance}

  - job_name: llamacpp
    metrics_path: /metrics
    dns_sd_configs:
      - {names: [llama-chat, llama-coder, llama-embed], type: A, port: 8080}
    relabel_configs: *by-name

  - job_name: mock-vllm
    metrics_path: /metrics
    dns_sd_configs:
      - {names: [mock-vllm-a, mock-vllm-b], type: A, port: 8000}
    relabel_configs: *by-name

  - job_name: mock-dcgm
    metrics_path: /metrics
    dns_sd_configs:
      - {names: [mock-dcgm-a, mock-dcgm-b], type: A, port: 8000}
    relabel_configs: *by-name

  - job_name: vllm
    metrics_path: /metrics
    dns_sd_configs:
      - {names: [vllm-cpu], type: A, port: 8000}
    relabel_configs: *by-name
