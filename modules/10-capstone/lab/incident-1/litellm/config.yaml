# Gateway config (reference solution). Both replicas mount this directory.
model_list:
  - model_name: chat
    litellm_params: {model: openai/chat, api_base: "http://mock-vllm-a:8000/v1", api_key: none}
    model_info: {id: chat-a}
  - model_name: chat
    litellm_params: {model: openai/chat, api_base: "http://mock-vllm-b:8000/v1", api_key: none}
    model_info: {id: chat-b}

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  proxy_batch_write_at: 5

litellm_settings:
  callbacks: ["prometheus"]
  require_auth_for_metrics_endpoint: false
  cache: true                  # rate-limit counters live in Valkey, shared by both replicas
  cache_params:
    type: redis
    host: valkey
    port: 6379
    supported_call_types: []   # no response caching, counters only

router_settings:
  routing_strategy: simple-shuffle
  redis_host: valkey
  redis_port: 6379
