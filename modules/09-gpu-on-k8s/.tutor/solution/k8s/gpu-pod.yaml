apiVersion: v1
kind: Pod
metadata:
  name: gpu-ok
  namespace: gpu-lab
  labels:
    course: aiinfra
spec:
  terminationGracePeriodSeconds: 1
  nodeSelector:
    nvidia.com/gpu.product: NVIDIA-A100-SXM4-80GB
  tolerations:
    - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
  containers:
    - name: main
      image: python:3.12-slim
      imagePullPolicy: IfNotPresent
      command: ["sleep", "3600"]
      resources:
        limits:
          nvidia.com/gpu: 1
