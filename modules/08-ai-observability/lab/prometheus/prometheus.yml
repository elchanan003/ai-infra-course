# Task 8.1: Prometheus config for the AI stack (lab-only 5 s scrape interval).
global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s
  external_labels:
    stack: aiinfra

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  # TODO 8.1: jobs `vllm` (two targets, label replica=a|b), `litellm` (note the metrics path), `llamacpp`.
  # In-network names/ports: mock-vllm-a:8000, mock-vllm-b:8000, litellm:4000, llama-chat:8080 (platform/stack/README.md).
