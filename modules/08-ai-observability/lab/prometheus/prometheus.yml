global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s
  external_labels:
    stack: aiinfra

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: vllm
    metrics_path: /metrics
    static_configs:
      - targets: ['mock-vllm-a:8000']
        labels: {replica: a}
      - targets: ['mock-vllm-b:8000']
        labels: {replica: b}

  - job_name: litellm
    metrics_path: /metrics/        # /metrics answers 307 -> /metrics/
    static_configs:
      - targets: ['litellm:4000']

  - job_name: llamacpp
    metrics_path: /metrics
    static_configs:
      - targets: ['llama-chat:8080']
