model_list:
  - model_name: chat
    litellm_params: {model: openai/chat, api_base: "http://llama-chat:8080/v1", api_key: none}
    model_info: {id: chat-llama, input_cost_per_token: 0.000001, output_cost_per_token: 0.000002}
  - model_name: coder
    litellm_params: {model: openai/coder, api_base: "http://llama-coder:8080/v1", api_key: none}
    model_info: {id: coder-llama, input_cost_per_token: 0.000001, output_cost_per_token: 0.000002}
  - model_name: embed
    litellm_params: {model: openai/embed, api_base: "http://llama-embed:8080/v1", api_key: none}
    model_info: {id: embed-llama, input_cost_per_token: 0.0000001}

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  proxy_batch_write_at: 5          # lab-only

litellm_settings:
  callbacks: ["prometheus"]
  require_auth_for_metrics_endpoint: false   # lab-only
  cache: true
  cache_params:
    type: redis
    host: valkey
    port: 6379
    supported_call_types: []       # shared counters only, no response caching

router_settings:
  redis_host: valkey
  redis_port: 6379
