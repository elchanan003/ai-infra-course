# Task 8.7 (part L only): LiteLLM config for the Langfuse gate. Based on the platform base config minus the llama.cpp aliases.
# TODO 8.7: send traces to Langfuse. The container already has LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY / LANGFUSE_HOST in its environment.
model_list:
  - model_name: mock-a
    litellm_params: {model: openai/chat, api_base: "http://mock-vllm-a:8000/v1", api_key: none}
  - model_name: mock-b
    litellm_params: {model: openai/chat, api_base: "http://mock-vllm-b:8000/v1", api_key: none}

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  proxy_batch_write_at: 5

litellm_settings:
  callbacks: ["prometheus"]
  require_auth_for_metrics_endpoint: false
  cache: true
  cache_params:
    type: redis
    host: valkey
    port: 6379
    supported_call_types: []

router_settings:
  redis_host: valkey
  redis_port: 6379
