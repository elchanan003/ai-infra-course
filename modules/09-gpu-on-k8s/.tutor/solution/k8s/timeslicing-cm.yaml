apiVersion: v1
kind: ConfigMap
metadata:
  name: time-slicing-config
  namespace: gpu-lab
  labels:
    course: aiinfra
data:
  # Time-slicing multiplies the advertised count. It gives NO memory isolation, NO fault isolation and NO latency guarantee.
  any: |-
    version: v1
    flags:
      migStrategy: none
    sharing:
      timeSlicing:
        renameByDefault: true
        failRequestsGreaterThanOne: true
        resources:
          - name: nvidia.com/gpu
            replicas: 4
