# Platform-side gateway config for module 06 (given; not a learner file).
model_list:
  - {model_name: chat,  litellm_params: {model: openai/chat,  api_base: "http://llama-chat:8080/v1",  api_key: none}}
  - {model_name: embed, litellm_params: {model: openai/embed, api_base: "http://llama-embed:8080/v1", api_key: none}}
  # simulated engines (mock-chat scripted mode on A; FIM echo on B)
  - {model_name: agent, litellm_params: {model: openai/chat, api_base: "http://mock-vllm-a:8000/v1", api_key: none}}
  - {model_name: coder, litellm_params: {model: openai/chat, api_base: "http://mock-vllm-b:8000/v1", api_key: none}}
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  proxy_batch_write_at: 5
  store_prompts_in_spend_logs: true
litellm_settings:
  callbacks: ["prometheus"]
  require_auth_for_metrics_endpoint: false
  cache: true
  cache_params: {type: redis, host: valkey, port: 6379, supported_call_types: []}
router_settings: {redis_host: valkey, redis_port: 6379}
