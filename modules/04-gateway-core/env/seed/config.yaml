# Platform-side config used by prepare-lab.sh ONLY to seed state (legacy keys, team lab-ds); never shown to the learner as a model answer.
model_list:
  - {model_name: chat,  litellm_params: {model: openai/chat,  api_base: "http://llama-chat:8080/v1",  api_key: none}}
  - {model_name: coder, litellm_params: {model: openai/coder, api_base: "http://llama-coder:8080/v1", api_key: none}}
  - {model_name: embed, litellm_params: {model: openai/embed, api_base: "http://llama-embed:8080/v1", api_key: none}}
general_settings: {master_key: os.environ/LITELLM_MASTER_KEY, database_url: os.environ/DATABASE_URL, proxy_batch_write_at: 5}
litellm_settings: {callbacks: ["prometheus"], require_auth_for_metrics_endpoint: false}
